<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#1557b0"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#137333"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Biometric Viewfinder Corners -->
  <path d="M16 23V18C16 16.8954 16.8954 16 18 16H23" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 23V18C48 16.8954 47.1046 16 46 16H41" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 41V46C16 47.1046 16.8954 48 18 48H23" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Biometric Node / Face Scan Outline -->
  <circle cx="32" cy="27" r="7" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.95"/>
  <path d="M21 42C21.5 37 26 35 32 35C35 35 37.8 35.8 39.8 37.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Verified Live Badge (Green Checkmark Badge in lower right) -->
  <g filter="url(#glow)">
    <circle cx="45" cy="45" r="9.5" fill="#ffffff"/>
    <circle cx="45" cy="45" r="8" fill="url(#checkGrad)"/>
    <path d="M41.5 45L43.8 47.3L48.5 42.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>