<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Google / Liveness Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#1557b0"/>
    </linearGradient>

    <!-- Verified Badge Gradient: Google / Liveness Green -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#137333"/>
    </linearGradient>

    <!-- Shadow for verified badge clarity at micro dimensions -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Dark-Tab Anti-Blend Boundary Ring -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="16" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Biometric Viewfinder Corners (Thickened for 16px/32px Tab-Bar Clarity) -->
  <path d="M15 22V17C15 15.34 16.34 14 18 14H23" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round"/>
  <path d="M49 22V17C49 15.34 47.66 14 46 14H41" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round"/>
  <path d="M15 42V47C15 48.66 16.34 50 18 50H23" stroke="#ffffff" stroke-width="3.75" stroke-linecap="round"/>

  <!-- Center Biometric Node / Face Scan Contour -->
  <circle cx="32" cy="27" r="7.5" stroke="#ffffff" stroke-width="3.25" fill="none"/>
  <path d="M21 43C21.5 37 26 34.5 32 34.5C35.5 34.5 38.5 35.5 40.5 37.5" stroke="#ffffff" stroke-width="3.25" stroke-linecap="round" fill="none"/>

  <!-- Verified Live Badge (High-Contrast Green Checkmark Badge) -->
  <g filter="url(#badgeShadow)">
    <circle cx="45.5" cy="45.5" r="9.5" fill="#ffffff"/>
    <circle cx="45.5" cy="45.5" r="8" fill="url(#checkGrad)"/>
    <path d="M42 45.5L44.5 48L49.5 43" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>