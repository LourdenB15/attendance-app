services:
  - type: web
    name: attendance-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install && npm run migrate:up
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon PostgreSQL connection string
      - key: JWT_SECRET
        generateValue: true
      - key: LIVENESS_API_KEY
        sync: false
      - key: LIVENESS_API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
